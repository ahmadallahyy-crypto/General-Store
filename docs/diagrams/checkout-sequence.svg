<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">Actual checkout sequence</title><desc id="desc">Browser checkout computes totals, on submit clears local cart and displays local confirmation. No order persistence or payment occurs.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#2563eb"/></marker><marker id="d" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#9ca3af"/></marker></defs><rect width="1100" height="760" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Checkout: what the code actually does</text>
<g font-family="Arial" text-anchor="middle"><rect x="55" y="75" width="190" height="65" rx="10" fill="#fff" stroke="#334155"/><text x="150" y="103" font-size="15" font-weight="700">Shopper</text><text x="150" y="125" font-size="12">browser</text><rect x="310" y="75" width="240" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="430" y="103" font-size="14" font-weight="700">CheckoutPage()</text><text x="430" y="125" font-size="12">src/app/checkout/page.tsx</text><rect x="620" y="75" width="220" height="65" rx="10" fill="#ccfbf1" stroke="#0f766e"/><text x="730" y="103" font-size="14" font-weight="700">CartProvider()</text><text x="730" y="125" font-size="12">cart-context.tsx</text><rect x="900" y="75" width="160" height="65" rx="10" fill="#fff" stroke="#0f766e"/><text x="980" y="103" font-size="14" font-weight="700">localStorage</text><text x="980" y="125" font-size="12">browser</text></g>
<path d="M550 145 V700" stroke="#cbd5e1" stroke-dasharray="6 6"/><path d="M730 145 V700" stroke="#cbd5e1" stroke-dasharray="6 6"/><path d="M980 145 V700" stroke="#cbd5e1" stroke-dasharray="6 6"/><path d="M150 145 V700" stroke="#cbd5e1" stroke-dasharray="6 6"/>
<g font-family="Arial" font-size="13" fill="#0f172a"><path d="M550 190 H730" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="640" y="178" text-anchor="middle">CheckoutPage() reads useCart()</text><text x="740" y="215">cartTotal = sum(price × quantity)</text><text x="740" y="235" fill="#b91c1c">Computed in the browser</text>
<path d="M550 275 H550" stroke="#2563eb" stroke-width="2"/><rect x="320" y="255" width="430" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="535" y="286" text-anchor="middle">CheckoutPage() computes orderTotal = cartTotal + selected fixed delivery fee</text>
<path d="M150 345 H550" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="350" y="335" text-anchor="middle">submits checkout form</text>
<rect x="310" y="365" width="460" height="60" rx="8" fill="#fff" stroke="#2563eb"/><text x="540" y="390" text-anchor="middle" font-weight="700">handleSubmit() — checkout/page.tsx</text><text x="540" y="411" text-anchor="middle">prevents default; waits briefly; sets local submitted state</text>
<path d="M550 455 H730" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="640" y="445" text-anchor="middle">clearCart() / setCart([])</text><path d="M730 490 H980" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="855" y="478" text-anchor="middle">usePersistentState effect writes acme-cart</text>
<path d="M550 550 H150" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="350" y="540" text-anchor="middle">shows demo confirmation</text>
<rect x="55" y="590" width="470" height="95" rx="12" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/><text x="290" y="620" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#991b1b">Payment service: NOT FOUND</text><text x="290" y="647" text-anchor="middle" font-family="Arial" font-size="13">No payment request or verification</text>
<rect x="575" y="590" width="470" height="95" rx="12" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/><text x="810" y="620" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#991b1b">Order persistence: NOT FOUND</text><text x="810" y="647" text-anchor="middle" font-family="Arial" font-size="13">No saved order is created</text>
<path d="M430 425 C250 500 190 550 220 590" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#d)"/><path d="M500 425 C650 500 810 540 810 590" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#d)"/></svg>
