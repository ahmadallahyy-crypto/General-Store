<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Acme Shop actual system architecture</title><desc id="desc">Frontend reads local fixture data and stores cart and wishlist in browser localStorage. Backend, database, payment, messaging, and managed image storage are not found.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="dash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/></marker></defs>
<rect width="1100" height="600" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Actual system architecture</text>
<g font-family="Arial" text-anchor="middle"><rect x="35" y="225" width="150" height="75" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="110" y="258" font-size="17" font-weight="700">Shopper browser</text><text x="110" y="280" font-size="13" fill="#475569">interactive UI</text>
<rect x="255" y="190" width="220" height="145" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="365" y="225" font-size="18" font-weight="700">Frontend</text><text x="365" y="251" font-size="14">src/app + src/components</text><text x="365" y="276" font-size="13">CartProvider / WishlistProvider</text><text x="365" y="302" font-size="13">React client state</text>
<rect x="550" y="105" width="215" height="75" rx="14" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="657" y="137" font-size="16" font-weight="700">Catalog</text><text x="657" y="160" font-size="13">src/data/products.ts</text>
<rect x="550" y="218" width="215" height="75" rx="14" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="657" y="250" font-size="16" font-weight="700">Marketplace fixtures</text><text x="657" y="273" font-size="13">src/lib/mock/marketplace.ts</text>
<rect x="550" y="350" width="215" height="75" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="657" y="382" font-size="16" font-weight="700">Browser localStorage</text><text x="657" y="405" font-size="13">cart + wishlist only</text>
<rect x="850" y="85" width="210" height="360" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><text x="955" y="118" font-size="17" font-weight="700" fill="#475569">NOT FOUND</text><text x="955" y="148" font-size="14">Backend / API</text><text x="955" y="188" font-size="14">Database</text><text x="955" y="228" font-size="14">Payment provider</text><text x="955" y="268" font-size="14">Email / SMS</text><text x="955" y="308" font-size="14">Managed image storage</text><text x="955" y="360" font-size="12" fill="#64748b">No implemented connection</text></g>
<g stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M185 262 H255"/><path d="M475 225 C510 225 510 143 550 143"/><path d="M475 262 H550"/><path d="M475 300 C510 300 510 387 550 387"/></g><g font-family="Arial" font-size="12" fill="#334155"><text x="212" y="250">renders</text><text x="493" y="170">imports data</text><text x="493" y="252">imports fixtures</text><text x="492" y="355">persists state</text></g>
<path d="M475 207 C650 20 780 30 850 150" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#dash)"/><text x="680" y="70" font-family="Arial" font-size="12" fill="#64748b">server integrations absent</text>
