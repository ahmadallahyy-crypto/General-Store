<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Existing TypeScript data shapes</title><desc id="desc">TypeScript fixture relationships only. No database tables, user, or payment model exists.</desc>
<rect width="1000" height="570" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Existing data shapes (not database tables)</text>
<g font-family="Arial" fill="#0f172a"><g><rect x="55" y="105" width="245" height="180" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><path d="M55 145 H300" stroke="#2563eb" stroke-width="2"/><text x="177" y="132" text-anchor="middle" font-size="17" font-weight="700">Product</text><text x="75" y="172" font-size="14">id, handle, title</text><text x="75" y="197" font-size="14">price, currency</text><text x="75" y="222" font-size="14">category, subcategory</text><text x="75" y="247" font-size="14">image(s), description</text></g>
<g><rect x="380" y="105" width="245" height="180" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><path d="M380 145 H625" stroke="#0f766e" stroke-width="2"/><text x="502" y="132" text-anchor="middle" font-size="17" font-weight="700">MarketplaceProduct</text><text x="400" y="172" font-size="14">extends Product</text><text x="400" y="197" font-size="14">sellerId, brand</text><text x="400" y="222" font-size="14">rating, reviewCount</text><text x="400" y="247" font-size="14">delivery, mock payment labels</text></g>
<g><rect x="700" y="105" width="245" height="145" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><path d="M700 145 H945" stroke="#0f766e" stroke-width="2"/><text x="822" y="132" text-anchor="middle" font-size="17" font-weight="700">Seller</text><text x="720" y="172" font-size="14">id, name, category</text><text x="720" y="197" font-size="14">rating, seller details</text></g>
<g><rect x="55" y="365" width="245" height="130" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><path d="M55 405 H300" stroke="#7c3aed" stroke-width="2"/><text x="177" y="392" text-anchor="middle" font-size="17" font-weight="700">CartItem</text><text x="75" y="432" font-size="14">copied Product fields</text><text x="75" y="457" font-size="14">quantity</text><text x="75" y="480" font-size="12" fill="#64748b">localStorage state</text></g>
<g><rect x="380" y="350" width="245" height="160" rx="10" fill="#fff" stroke="#d97706" stroke-width="2"/><path d="M380 390 H625" stroke="#d97706" stroke-width="2"/><text x="502" y="377" text-anchor="middle" font-size="17" font-weight="700">Order</text><text x="400" y="418" font-size="14">id, createdAt, status</text><text x="400" y="443" font-size="14">total, deliveryAddress</text><text x="400" y="473" font-size="14">items: OrderItem[]</text></g>
<g><rect x="700" y="350" width="245" height="160" rx="10" fill="#fff" stroke="#d97706" stroke-width="2"/><path d="M700 390 H945" stroke="#d97706" stroke-width="2"/><text x="822" y="377" text-anchor="middle" font-size="17" font-weight="700">OrderItem</text><text x="720" y="418" font-size="14">productId, title, image</text><text x="720" y="443" font-size="14">sellerId, quantity, price</text><text x="720" y="476" font-size="12" fill="#64748b">embedded fixture shape</text></g></g>
